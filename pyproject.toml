[project]
name = "ml-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "memory-profiler>=0.61.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
ml-lab = "ml_lab:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
